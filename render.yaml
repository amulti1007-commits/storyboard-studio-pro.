services:
  - type: web
    name: storyboard-studio-pro
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_USER
        sync: false
      - key: APP_PASSWORD
        sync: false
